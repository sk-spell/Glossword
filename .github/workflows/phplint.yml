name: PHP Linting
# https://github.com/michaelw90/PHP-Lint

on:
 push:
   branches: [ "stand-alone" ]
 pull_request:
   branches: [ "stand-alone" ]
  workflow_dispatch:
  
jobs:
  phplint:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v1
        - uses: michaelw90/PHP-Lint@master
